name: stark-vms-assignment1
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_DATABASE: stark_vms_assignment1
      MYSQL_USER: stark
      MYSQL_PASSWORD: stark_dev_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - vms_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  vms_mysql_data:
